name: Finalize archive migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-archive-migration.yml'

permissions:
  contents: write

env:
  ELIAS: bot-files/elias-thorne/worldbooks/Blackbriar_Elias_World_Book_v3_MAX_TRIGGER_FINAL.json
  SOREN: bot-files/soren-pike/Soren_Pike_Tipsy_Background_LAUNCH_FINAL_v2.txt

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble candidate
        shell: bash
        run: |
          set -euo pipefail
          STAGING='bot-files/elias-thorne/_staging/worldbook'
          test "$(find "$STAGING" -maxdepth 1 -type f -name 'part-*.txt' | wc -l | tr -d ' ')" = '21'
          mkdir -p "$(dirname "$ELIAS")"
          cat "$STAGING"/part-*.txt > "$ELIAS"

          python - <<'PY'
          from pathlib import Path
          p = Path('bot-files/elias-thorne/worldbooks/Blackbriar_Elias_World_Book_v3_MAX_TRIGGER_FINAL.json')
          s = p.read_text(encoding='utf-8')
          needle = '        "True Luna bloodline",\n        "Luna bloodline families Rosemond",'
          replacement = '        "True Luna bloodline",\n        "Luna bloodline families",\n        "Luna bloodline families Rosemond",'
          if needle in s:
              s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY

          wc -c "$ELIAS"
          sha256sum "$ELIAS" | tee /tmp/elias-candidate.sha256

      - name: Upload candidate for byte audit
        uses: actions/upload-artifact@v4
        with:
          name: elias-migration-candidate
          path: |
            ${{ env.ELIAS }}
            /tmp/elias-candidate.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Verify approved source hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < "$ELIAS" | tr -d ' ')" = '295065'
          echo '7c17477f145cfc8a4e75b8992cfb21a32c30adce50925549995d35b72234e362  bot-files/elias-thorne/worldbooks/Blackbriar_Elias_World_Book_v3_MAX_TRIGGER_FINAL.json' | sha256sum --check --strict

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          elias = Path('bot-files/elias-thorne/worldbooks/Blackbriar_Elias_World_Book_v3_MAX_TRIGGER_FINAL.json')
          with elias.open('r', encoding='utf-8') as fh:
              json.load(fh)

          soren = Path('bot-files/soren-pike/Soren_Pike_Tipsy_Background_LAUNCH_FINAL_v2.txt')
          data = soren.read_bytes()
          if not data.endswith(b'\n'):
              soren.write_bytes(data + b'\n')
          data = soren.read_bytes()
          assert len(data) == 63152, len(data)
          assert hashlib.sha256(data).hexdigest() == '9c435296eb58a2d130b43931711ca206e36df772c8d37ff645f544db4cac1a0c'
          PY

      - name: Commit verified archive
        shell: bash
        run: |
          set -euo pipefail
          cat > bot-files/SOURCE-ARCHIVE-MANIFEST.md <<'EOF'
          # Source Archive Manifest

          This manifest fingerprints the approved original DOCX handoffs preserved outside the repository. The repository keeps readable production companions rather than pretending converted Markdown is the original binary document.

          | Bot | Approved original | Bytes | SHA-256 | Repository companion |
          | --- | --- | ---: | --- | --- |
          | Alistair Fieter | `Alistair_Fiechter_NPC_Handoff_FINAL_UPDATED.docx` | 1,553,097 | `15ff8aabc24e5b4a99b12b030fb4e9a5c7f9f6e1be4469a861394ea888e44b1c` | `alistair-fieter/character/Alistair_Fiechter_NPC_Handoff_FINAL_UPDATED.md` |
          | Elias Thorne | `Blackbriar_Elias_Master_Handoff_Expanded.docx` | 70,360 | `a68ef451c31bc7c8c626665b79f7392423ad63353b26162c315975bc1efbab04` | `elias-thorne/exports/` and `elias-thorne/worldbooks/` |
          | Davian Astor | `Davian_Astor_NPC_Handoff.docx` | 3,973,776 | `f61085296c7d2f24051b2e9dbe08ff1b4602623e0f4de2ec28d86fbc438a17b2` | `davian-astor/character/Davian_Astor_NPC_Handoff.md` |
          | Elirosa Bloom | `Elirosa_Bloom_NPC_Handoff_UPDATED_CANON_FINAL.docx` | 4,497,965 | `02f501c632683d16129bd99d0e410c7eae3549e399fa19613671b51fa1e81c76` | `elirosa-bloom/character/Elirosa_Bloom_NPC_Handoff_UPDATED_CANON_FINAL.md` |
          | Dr. Kairos Adebisi | `Kairos_Adebisi_Approved_Canon_Handover.docx` | 46,736 | `8f43e967376fa78b844fbdc412da5b3910c4550420fdd0fed7d5419205a3c496` | `dr-kairos-adebisi/character/Kairos_Adebisi_Approved_Canon_Handover.md` |

          ## Production verification

          - Elias world book: `Blackbriar_Elias_World_Book_v3_MAX_TRIGGER_FINAL.json`
            - bytes: `295065`
            - SHA-256: `7c17477f145cfc8a4e75b8992cfb21a32c30adce50925549995d35b72234e362`
            - valid JSON: verified during migration finalization
          - Soren production background: `Soren_Pike_Tipsy_Background_LAUNCH_FINAL_v2.txt`
            - bytes: `63152`
            - SHA-256: `9c435296eb58a2d130b43931711ca206e36df772c8d37ff645f544db4cac1a0c`
            - terminal newline: verified

          Generated during the 2026-09-02 archive migration.
          EOF

          rm -rf 'bot-files/elias-thorne/_staging'
          git rm '.github/workflows/finalize-archive-migration.yml'
          git config user.name 'Dollie Archive Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Elias archive migration'
          git push origin HEAD:main
